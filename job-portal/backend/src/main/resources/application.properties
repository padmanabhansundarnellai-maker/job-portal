server.port=8080
server.error.include-message=always

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/jobportal?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

jwt.secret=change-this-secret-to-a-long-random-string-of-32-plus-chars
jwt.expiration-ms=86400000

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload-dir=uploads

# Optional: set these to send real status-change emails (Gmail app password etc.).
# Without them the app simply logs the email instead of sending it.
#spring.mail.host=smtp.gmail.com
#spring.mail.port=587
#spring.mail.username=your@gmail.com
#spring.mail.password=your-app-password
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=noreply@jobportal.local
